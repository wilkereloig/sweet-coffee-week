<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<!-- `viewport-fit=cover` é o que dá valor às sete declarações `env(safe-area-inset-*)`
     do CSS. Sem ele o iOS resolve todas em 0 e a barra de abas fica com 8px de
     respiro na base em vez de 8+34px, encostada no indicador de home. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sweet & Coffee Week | Festival de doces e cafés em Natal</title>
<meta name="description" content="O festival que transforma Natal em uma rota de sabores: conheça as 16 edições, o Sweet Awards, os participantes e como fazer parte do Sweet & Coffee Week." />
<link rel="icon" type="image/svg+xml" href="/favicon-sweet.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />

<!-- Camada de aplicativo (ago/2026). Os ícones já existiam em disco; faltava a
     declaração. Com isto, "adicionar à tela de início" passa a abrir sem a
     barra do navegador, com ícone e nome próprios.
     `theme-color` é o chocolate da tinta principal (§6.1), que é a cor do véu do
     cabeçalho — a barra de status encosta nele sem emenda de cor.
     A barra de status fica `default` de propósito, e NÃO `black-translucent`:
     esta última joga o conteúdo por baixo dela, e a zona de segurança do §6.7
     (a logo que transborda metade abaixo da linha do header) é calculada sem
     recorte de topo. Trocar isso exige refazer `--scw-hero-topo` primeiro. -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#3D1308" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sweet & Coffee" />
<!-- O iOS transforma número de telefone em link sozinho e desalinha o rodapé. -->
<meta name="format-detection" content="telephone=no" />

<!-- Open Graph / Twitter — preview ao compartilhar (WhatsApp/Instagram/Facebook).
     Estático: crawlers sociais não executam JS. Capa 1200x630 = /public/og-cover.jpg

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Sweet & Coffee Week" />
<meta property="og:url" content="https://www.sweetcoffeeweek.com.br/" />
<meta property="og:title" content="Sweet & Coffee Week | Festival de doces e cafés em Natal" />
<meta property="og:description" content="O festival que transforma Natal em uma rota de sabores: 16 edições, Sweet Awards e as melhores marcas da cidade." />
<meta property="og:image" content="https://www.sweetcoffeeweek.com.br/og-cover.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Sweet & Coffee Week | Festival de doces e cafés em Natal" />
<meta name="twitter:description" content="O festival que transforma Natal em uma rota de sabores: 16 edições, Sweet Awards e as melhores marcas da cidade." />
<meta name="twitter:image" content="https://www.sweetcoffeeweek.com.br/og-cover.jpg" />

<!-- Aqui moravam três folhas de estilo externas que bloqueavam a primeira
     pintura de TODA página e não vestiam nada (removidas em ago/2026):
     · Google Fonts com Instrument Serif, DM Sans, Caveat, Caprasimo e
       JetBrains Mono — conferidas uma a uma, zero consumidores em src/ e em
       public/. A JetBrains Mono ainda era a face que o §6.5 proíbe;
     · dois Typekit (kgh7res, ngx4uek), que serviam só a Sofia Pro Comp do KV
       Lovers e morreram com ele (§4.1 e Anexo A.1). A única menção a "Sofia
       Pro" que restou no código é um comentário mandando NÃO usar.
     A tipografia viva é a Nexa Slab, self-hosted em public/fonts/nexa-slab/ —
     inclusive na /em-breve, cujo `--font-sans` resolve para ela.
     A folha do Archivo continua mais abaixo: essa tem consumidor real, a seção
     07 da Home (a exceção declarada do §6.1).

     As duas faces que abrem toda página vão em `preload`. Elas são
     `font-display: swap`, então sem isso o texto pintava na fonte do sistema e
     re-fluía ao trocar — medido 0,0736 de CLS na Home, quase todo daí. -->
     São as duas do §6.5 que aparecem acima da dobra em todas as rotas: o 500
     (Regular), que é o corpo e o lead, e o 900 (Black), que é todo H1, H2 e
     numeral. As outras dez faces seguem sob demanda. -->
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/nexa-slab/NexaSlab-Regular.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/nexa-slab/NexaSlabBlack.woff2" />

<body class="stickers-medium">
<div id="root"></div>
<script>
/* Reporter global de erro — captura QUALQUER erro (inclusive antes/fora do React)
   e mostra na tela em vez de deixar em branco. Diagnostico para devices especificos. */
(function () {
  function show(title, detail) {
    try {
      var root = document.getElementById('root');
      if (root && root.children.length > 0 && !root.getAttribute('data-err')) return;
      if (!root) return;
      root.setAttribute('data-err', '1');
      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FFF1E6;font-family:Helvetica,Arial,sans-serif">' +
        '<div style="max-width:560px;width:100%;background:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.12);color:#3F1A0A">' +
        '<h1 style="margin:0 0 8px;font-size:20px;color:#D63648">Erro detectado</h1>' +
        '<p style="margin:0 0 12px;font-size:14px">Mande um print desta tela.</p>' +
        '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;background:#FBEADC;border-radius:10px;padding:12px;margin:0;max-height:60vh;overflow:auto;color:#6B4A3A">' +
        String(title) + '\n\n' + String(detail || '') + '</pre></div></div>';
    } catch (e) {}
  }
  // Só reporta erro do NOSSO código (mesma origem). Ignora ruído de terceiros que
  // não deve derrubar a tela: embeds do Instagram (cross-origin -> "Script error."
  // sem filename), extensões do browser (chrome-extension://), scripts externos.
  function ours(fn) { return typeof fn === 'string' && fn.indexOf(location.origin) === 0; }
  window.addEventListener('error', function (e) {
    var fn = e.filename || '';
    if (!fn || e.message === 'Script error.' || !ours(fn)) return;
    show(e.message || 'window.error', fn + ':' + (e.lineno || '') + ':' + (e.colno || '') + '\n' + ((e.error && e.error.stack) || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    var stack = r.stack || '';
    if (!stack || stack.indexOf(location.origin) === -1) return; // só rejeições do nosso código
    show('unhandledrejection: ' + (r.message || r), stack);
  });
})();
</script>
<script type="module" src="/src/main.jsx"></script>
