<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Painel SCW</title>
    <link rel="manifest" href="/painel/app.webmanifest" />
    <meta name="theme-color" content="#3D1308" />
    <!-- Sem isso o iOS não expõe PushManager mesmo instalado na tela inicial
         (CLAUDE.md §Fase 7 — "notificações"). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Painel SCW" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="icon" href="/favicon-sweet.svg" type="image/svg+xml" />
    <!-- Nexa (interface) e Nexa Text (leitura), a mesma família do site
         (CLAUDE.md §6.5, kit ngx4uek). Sem o Typekit nada quebra: o fallback
         dos dois tokens é a Nexa Slab local. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <!-- O kit carrega pelo JS: desde 29/09/2026 o endereço ngx4uek.css responde 412
         (ao que tudo indica, o kit passou a servir só pelo embed JS) e o
         <link> deixava tudo cair no fallback, a Slab. -->
    <script>
      (function(d) {
        var config = {
          kitId: 'ngx4uek',
          scriptTimeout: 3000,
          async: true
        },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
      })(document);
    </script>
    <link rel="stylesheet" href="/painel-app/src/styles/painel.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/painel-app/src/main.jsx"></script>
  </body>
</html>
